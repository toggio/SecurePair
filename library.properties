name=SecurePair
version=0.5.0
author=Luca Soltoggio
maintainer=Luca Soltoggio
sentence=Cryptographically secure pairing and communication between ESP32 boards: pair through a single standard LED with the LX.25 protocol, or over ESP-NOW and LoRa.
paragraph=Beta. Two boards agree on a key with X25519, the user checks that both show the same short code (on an LED, an RGB LED or as digits), then messages are encrypted with AES-256-GCM, with replay protection. Persistent identities, up to 8 peers, safe re-pairing. Pair over one medium and talk over another: PacketLED (light), ESP-NOW, LoRa or your own. Once the chip has its own eFuse key, the saved keys are encrypted with it.
category=Communication
url=https://github.com/toggio/SecurePair
architectures=esp32
depends=PacketLED (>=1.1.0)
includes=SecurePairLed.h
